name: ProjectTomo
options:
  bundleIdPrefix: com.tomo
  deploymentTarget:
    iOS: "26.0"
  xcodeVersion: "26.4"
  createIntermediateGroups: true
  generateEmptyDirectories: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    TARGETED_DEVICE_FAMILY: "1"
    INFOPLIST_KEY_UILaunchScreen_Generation: true
    INFOPLIST_KEY_UISupportedInterfaceOrientations: UIInterfaceOrientationPortrait
    INFOPLIST_KEY_UIApplicationSupportsIndirectInputEvents: true

targets:
  ProjectTomo:
    type: application
    platform: iOS
    sources:
      - path: ProjectTomo
        excludes:
          - "**/.DS_Store"
    settings:
      base:
        INFOPLIST_KEY_UILaunchScreen_Generation: true
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        PRODUCT_BUNDLE_IDENTIFIER: com.tomo.ProjectTomo
        MARKETING_VERSION: "1.0.0"
        CURRENT_PROJECT_VERSION: "1"
        DEVELOPMENT_TEAM: ""
        CODE_SIGN_IDENTITY: "Apple Development"
        CODE_SIGN_STYLE: Automatic
    info:
      path: ProjectTomo/Info.plist
      properties:
        UIAppFonts:
          - Lora-Bold.ttf
        UILaunchScreen: {}
        NSCameraUsageDescription: "TOMO needs camera access to take photos for stories"
        NSPhotoLibraryUsageDescription: "TOMO needs photo library access to add images to stories"
